name: build dotnet
on:
  push:
    branches:
      - master

jobs:
  build:

    runs-on: windows-latest
    strategy:
      matrix:
        dotnet-version: [ '10.0.x' ]

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET Core SDK ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      - name: Build
        run: dotnet build

      # Offline unit tests - these gate the build (and therefore the release workflow).
      - name: Test
        run: dotnet test --no-build --filter "TestCategory!=Integration" --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Coverage report
        if: always()
        shell: bash
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage -reporttypes:"MarkdownSummaryGithub;Cobertura"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage

      # Live tests against the real oEmbed endpoints. Third-party sites are flaky (rate limits, 403s, outages),
      # so failures are reported but do not fail the build.
      - name: Integration tests
        continue-on-error: true
        run: dotnet test --no-build --filter "TestCategory=Integration"
