name: build dotnet
on:
  push:
    branches:
      - master

jobs:
  build:

    runs-on: windows-latest
    permissions:
      contents: write # needed to publish the coverage badge to the "badges" branch
    strategy:
      matrix:
        dotnet-version: [ '10.0.x' ]

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET Core SDK ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      - name: Build
        run: dotnet build

      # Offline unit tests - these gate the build (and therefore the release workflow).
      - name: Test
        run: dotnet test --no-build --filter "TestCategory!=Integration" --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Coverage report
        if: always()
        shell: bash
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            "-reports:TestResults/**/coverage.cobertura.xml" \
            "-targetdir:coveragereport" \
            "-reporttypes:Badges;MarkdownSummaryGithub;Cobertura" \
            "-assemblyfilters:+OEmbed.Core"
          cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coveragereport

      - name: Publish coverage badges
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir badges
          cp coveragereport/badge_linecoverage.svg coveragereport/badge_branchcoverage.svg badges/
          cd badges
          git init -q -b badges
          git add .
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update coverage badges"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" badges

      # Live tests against the real oEmbed endpoints. Third-party sites are flaky (rate limits, 403s, outages),
      # so failures are reported but do not fail the build.
      - name: Integration tests
        continue-on-error: true
        run: dotnet test --no-build --filter "TestCategory=Integration"
